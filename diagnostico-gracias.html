<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- Amplitude: Analytics + Session Replay + Web Experiment + Guides & Surveys -->
<script src="https://cdn.amplitude.com/script/f75ce8e8fee4c57b00bf503150c825ae.js"></script>
<script src="https://cdn.amplitude.com/script/f75ce8e8fee4c57b00bf503150c825ae.engagement.js"></script>
<script>
  if (window.amplitude) {
  if (window.sessionReplay) window.amplitude.add(window.sessionReplay.plugin({ sampleRate: 1, privacyConfig: { defaultMaskLevel: 'light', unmaskSelector: ['input', 'textarea', 'select'] } }));
  if (window.engagement) window.amplitude.add(window.engagement.plugin());
  window.amplitude.init('f75ce8e8fee4c57b00bf503150c825ae', { fetchRemoteConfig: true, autocapture: true });
  }
</script>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¡Gracias! · Pitcheamos</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F7F4EF;color:#14213D;font-family:'Inter',system-ui,sans-serif;text-align:center;padding:24px}
h1{font-size:clamp(40px,7vw,72px);font-weight:900;letter-spacing:-.03em;margin:24px 0 12px}
h1 span{color:#EF6450}
p{color:#5B6474;font-size:19px;max-width:480px;margin:0 auto 32px}
a{display:inline-block;background:#EF6450;color:#fff;text-decoration:none;font-weight:700;padding:14px 26px;border-radius:999px}
svg{width:80px;height:80px}
</style>
</head>
<body>
<div>
  <svg viewBox="0 0 100 100" aria-hidden="true">
    <path d="M12 10 H58 Q66 10 66 18 V48 Q66 56 58 56 H30 L18 68 V56 H12 Q4 56 4 48 V18 Q4 10 12 10 Z" fill="#14213D"/>
    <path d="M88 40 H48 Q40 40 40 48 V74 Q40 82 48 82 H72 L84 94 V82 H88 Q96 82 96 74 V48 Q96 40 88 40 Z" fill="#EF6450"/>
  </svg>
  <h1>¡Listo! <span>Último paso.</span></h1>
  <p>Ya tengo tus respuestas. Elegí el día y la hora de tu sesión de diagnóstico.</p>
  <a id="book" href="https://meetings.hubspot.com/matias-bossie" style="background:#EF6450;color:#fff;border-radius:999px;padding:15px 26px;text-decoration:none;font-weight:700;display:inline-block">📅 Elegir día y hora</a>
  <p style="margin-top:18px;font-size:14px"><a href="/">Volver al inicio</a></p>
</div>
<script>
try {
  var l = JSON.parse(sessionStorage.getItem('pitch_lead') || '{}');
  var parts = (l.name || '').trim().split(/\s+/);
  var q = new URLSearchParams();
  if (l.email) q.set('email', l.email);
  if (parts[0]) q.set('firstName', parts[0]);
  if (parts.length > 1) q.set('lastName', parts.slice(1).join(' '));
  if (q.toString()) document.getElementById('book').href += '?' + q.toString();
} catch (e) {}
</script>
</body>
</html>
